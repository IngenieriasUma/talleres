<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Talleres Extracurriculares</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Figtree:wght@400;500;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<style>
:root{--wine:#470C28;--red:#EC244F;--grey:#EAEAEA;--bg:#EAEAEA;--surface:#fff;--text:#2a0a18;--muted:#6b4a5a;--line:#d6c9cf;--accent-text:#c3173d;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c0612;--surface:#2b0d1d;--text:#EAEAEA;--muted:#c5aab7;--line:#4a2336;--accent-text:#ff6a88}}
:root[data-theme="dark"]{--bg:#1c0612;--surface:#2b0d1d;--text:#EAEAEA;--muted:#c5aab7;--line:#4a2336;--accent-text:#ff6a88}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font:400 1rem/1.6 Figtree,system-ui,sans-serif}
h1,h2,h3{font-family:'Bricolage Grotesque',Figtree,sans-serif;line-height:1.1;margin:0}
a{color:inherit}
:focus-visible{outline:3px solid var(--red);outline-offset:3px;border-radius:4px}
/* Bootstrap-compatible grid */
.container{width:100%;max-width:1140px;margin:0 auto;padding:0 1.2rem}
.row{display:flex;flex-wrap:wrap;margin:0 -.6rem}
.row>*{padding:.6rem;width:100%}
@media(min-width:768px){.col-md-6{width:50%}.col-md-4{width:33.333%}}
@media(min-width:992px){.col-lg-4{width:33.333%}.col-lg-8{width:66.666%}.col-lg-3{width:25%}}
/* header */
.top{background:var(--wine);color:#fff}
.top .container{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding-top:.9rem;padding-bottom:.9rem}
.brand{font:800 1.5rem 'Bricolage Grotesque',sans-serif;text-decoration:none;display:flex;align-items:center;gap:.6rem}
.brand i{display:inline-block;width:28px;height:28px;border-radius:50% 50% 4px 4px;background:var(--red)}
.brand small{font:500 .78rem Figtree,sans-serif;opacity:.8;display:none}
@media(min-width:576px){.brand small{display:block}}
.btn{display:inline-block;border:0;border-radius:999px;padding:.7rem 1.4rem;font:700 1rem Figtree,sans-serif;text-decoration:none;cursor:pointer;background:var(--red);color:#fff;transition:transform .15s,background .15s}
.btn:hover{background:#d11a44;transform:translateY(-2px)}
.btn-ghost{background:transparent;border:2px solid currentColor}
.btn-ghost:hover{background:rgba(255,255,255,.12)}
/* hero */
.hero{background:var(--wine);color:#fff;padding:3rem 0 4.5rem}
.hero h1{font-size:clamp(2.4rem,7vw,4.6rem);font-weight:800;max-width:14ch}
.hero p{max-width:52ch;font-size:1.15rem;margin:1.2rem 0 1.8rem;opacity:.92}
.facts{display:flex;flex-wrap:wrap;gap:.6rem;margin:0;padding:0;list-style:none}
.facts li{background:rgba(255,255,255,.12);border-radius:999px;padding:.4rem 1rem;font-weight:500;font-size:.95rem}
.facts b{color:#ff9fb3}
/* week */
.week{margin-top:-2.5rem}
.sec-title{font-size:clamp(1.6rem,4vw,2.2rem);margin:3rem 0 .4rem}
.lead{color:var(--muted);margin:0 0 1.2rem;max-width:60ch}
.card-t{display:flex;flex-direction:column;height:100%;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;text-decoration:none;transition:transform .2s,box-shadow .2s}
.card-t:hover{transform:translateY(-4px);box-shadow:0 12px 28px rgba(71,12,40,.18)}
.day{background:var(--red);color:#fff;padding:.9rem 1.2rem;display:flex;justify-content:space-between;align-items:baseline}
.day strong{font:800 1.5rem 'Bricolage Grotesque',sans-serif}
.day span{font-weight:500;font-size:.9rem}
.card-t .body{padding:1.1rem 1.2rem 1.3rem;display:flex;flex-direction:column;gap:.6rem;flex:1}
.card-t h3{font-size:1.3rem}
.card-t p{margin:0;color:var(--muted);font-size:.95rem}
.who{font-weight:700;font-size:.95rem}
.more{margin-top:auto;font-weight:700;color:var(--accent-text);text-align: right;}
.info{background:var(--surface);border-radius:14px;padding:1.6rem;margin:2.5rem 0 3rem;border-left:6px solid var(--red)}
.info h2{font-size:1.5rem;margin-bottom:.5rem}
.info p{margin:0;color:var(--muted)}
/* detail */
.d-head{background:var(--wine);color:#fff;padding:1.6rem 0 3rem}
.back{background:none;border:0;color:#fff;font:700 1rem Figtree,sans-serif;cursor:pointer;padding:.3rem 0;margin-bottom:1.2rem}
.back:hover{text-decoration:underline}
.d-head h1{font-size:clamp(2rem,5.5vw,3.4rem);font-weight:800;max-width:20ch}
.d-head p{font-size:1.15rem;margin:.8rem 0 0;max-width:55ch;opacity:.9}
.box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:1rem 1.2rem;height:100%}
.box small{display:block;color:var(--muted);font-weight:500}
.box b{font-size:1.05rem}
.stats{margin-top:-2rem}
.chips{display:flex;flex-wrap:wrap;gap:.5rem;margin:.6rem 0 0;padding:0;list-style:none}
.chips li{background:var(--wine);color:#fff;border-radius:999px;padding:.35rem .9rem;font-weight:500;font-size:.92rem}
.goal{background:var(--surface);border-radius:14px;padding:1.5rem 1.6rem;border-left:6px solid var(--red);font-size:1.15rem}
.acc{display:grid;gap:.7rem}
.acc-item{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.acc-btn{width:100%;display:flex;align-items:center;gap:1rem;text-align:left;background:none;border:0;color:var(--text);padding: 0.5rem 0.7rem;cursor:pointer;font:700 1.1rem Figtree,sans-serif}
.acc-btn .n{flex:none;width:2.2rem;height:2.2rem;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;font-size:1rem}
.acc-btn .d{display:block;font-weight:500;font-size:.88rem;color:var(--muted)}
.acc-btn .ch{margin-left:auto;transition:transform .25s;font-size:1.2rem}
.acc-btn[aria-expanded="true"] .ch{transform:rotate(180deg)}
.acc-panel{display:none;padding:0 1.2rem 1.2rem 2.2rem}
.acc-panel.show{display:block}
.acc-panel h4{margin:0 0 .4rem;font-size:.95rem;color:var(--muted)}
.acc-panel ul{margin:0;padding-left:1.1rem}
.acc-panel li{margin:.25rem 0}
.nav2{display:flex;flex-wrap:wrap;gap:.8rem;justify-content:space-between;margin:2.5rem 0}
.nav2 .btn{background:var(--surface);color:var(--text);border:1px solid var(--line)}
.nav2 .btn:hover{background:var(--grey);color:#470C28}
.cta{background:var(--wine);color:#fff;border-radius:16px;padding:1.8rem;display:flex;flex-wrap:wrap;gap:1rem;align-items:center;justify-content:space-between}
.cta h2{font-size:1.5rem}
footer{background:var(--wine);color:#fff;margin-top:3.5rem;padding:1.6rem 0;font-size:.92rem}
footer .container{display:flex;flex-wrap:wrap;gap:.5rem 2rem;justify-content:space-between}
.fly{width:100%;max-width:460px;border-radius:14px;display:block;box-shadow:0 10px 26px rgba(71,12,40,.22)}
.fly-wrap{display:flex;flex-wrap:wrap;gap:1.5rem;align-items:center}
.fly-wrap .btn{align-self:flex-start}
.info{display:flex;flex-wrap:wrap;gap:1.5rem;align-items:center}
.info>div{flex:1 1 260px}
.view{animation:in .35s ease}
@keyframes in{from{opacity:0}to{opacity:1}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<header class="top"><div class="container">
  <a class="brand" href="#" id="logo"><img src="UMA.png" height="45"><small>Facultad de Ingeniería, Negocios y Derecho</small></a>
  <a class="btn" href="https://forms.cloud.microsoft/Pages/ResponsePage.aspx?id=cK3pz2eD7U6de06H_DXfJadUYVnaPepBsYGYGOJSdRxUQUxFMzVGRlhEOUo2UVZMU0hBV0lNMTg2MC4u" target="_blank" rel="noopener">Inscríbete</a>
</div></header>
<main id="app" tabindex="-1"></main>
<footer><div class="container"><span>Universidad María Auxiliadora | Facultad de Ingeniería, Negocios y Derecho</span><span>#CambiaTuHistoria | uma.edu.pe</span></div></footer>

<script>
const INFO={inicio:'9 de noviembre',ses:4,mod:'Virtual',precio:'S/. 360',cred:'02 créditos académicos extracurriculares'};
const FORM="https://forms.cloud.microsoft/Pages/ResponsePage.aspx?id=cK3pz2eD7U6de06H_DXfJadUYVnaPepBsYGYGOJSdRxUQUxFMzVGRlhEOUo2UVZMU0hBV0lNMTg2MC4u";
const FLY={
  general:"img/todo.png",
  negocios:"img/lunes.png",
  iavisual:"img/martes.png",
  video:"img/miercoles.png",
  powerbi:"img/jueves.png",
  niif:"img/viernes.png",
  ofimatica:"img/sabado.png"
};
const T=[
{id:'negocios',dia:'Lunes',start:9,hora:'6:00 p.m. a 9:30 p.m.',t:'De la idea a la acción: diseña tu plan de negocios ganador',s:'Modelo de negocio, cliente y mercado',p:'Mg. Christian Jesús Pérez Sánchez',
 logro:'Al finalizar, diseñas un plan de negocios coherente que conecta tu modelo de negocio, tu cliente y tu mercado.',
 ses:[['De la idea a la oportunidad',['Identificar problemas y oportunidades','Validar la idea','Definir la propuesta de valor']],
 ['Cliente y mercado',['Segmentación y perfil del cliente','Tamaño del mercado','Análisis de la competencia']],
 ['Modelo de negocio',['Business Model Canvas','Fuentes de ingreso y estructura de costos','Canales y relación con clientes']],
 ['Plan y presentación',['Proyección financiera básica','Plan de acción y metas','Pitch de tu plan de negocios']]]},
{id:'iavisual',dia:'Martes',start:10,hora:'6:00 p.m. a 9:30 p.m.',t:'IA generativa visual: de la idea al impacto profesional',s:'Presentaciones y documentos dinámicos con Canva Magic Studio, Gamma y Google Vids',p:'Mg. Paolo Paulino Arones Pérez',
 logro:'Al finalizar, creas presentaciones, documentos y videos de aspecto profesional usando herramientas de IA generativa visual.',
 ses:[['Fundamentos de la IA visual',['Qué es la IA generativa visual','Prompts efectivos','Uso ético y derechos de autor']],
 ['Diseño con Canva Magic Studio',['Imágenes y gráficos con IA','Plantillas y kit de marca','Edición asistida']],
 ['Presentaciones con Gamma',['Presentación a partir de un texto','Estructura y diseño automático','Mejorar y exportar']],
 ['Video y proyecto con Google Vids',['Guion y video con IA','Integración de recursos','Proyecto final profesional']]]},
{id:'video',dia:'Miércoles',start:11,hora:'6:00 p.m. a 9:30 p.m.',t:'Creación y edición de video con CapCut e IA para emprendedores',s:'Postproducción visual y dinamismo con CapCut',p:'Luis Enrique Rojas Parillo',
 logro:'Al finalizar, produces y editas videos dinámicos con CapCut e IA para promocionar tu emprendimiento.',
 ses:[['Primeros pasos en CapCut',['Interfaz y flujo de trabajo','Importar y organizar clips','Cortes y línea de tiempo']],
 ['Dinamismo visual',['Transiciones y efectos','Textos y subtítulos animados','Velocidad y fotogramas clave']],
 ['IA en la edición',['Guion y subtítulos automáticos','Quitar fondo y mejorar imagen','Voz y audio con IA']],
 ['Video para emprendedores',['Formatos para redes sociales','Identidad de marca','Exportación y publicación']]]},
{id:'powerbi',dia:'Jueves',start:12,hora:'6:00 p.m. a 9:30 p.m.',t:'Analítica de datos con Power BI + IA',s:'Creación de dashboard para análisis de ventas',p:'Jhon Robinson Rojas Díaz',
 logro:'Al finalizar, construyes un dashboard de ventas en Power BI que apoya la toma de decisiones.',
 ses:[['Introducción a Power BI',['Conceptos de inteligencia de negocios','Interfaz de Power BI','Conexión a fuentes de datos']],
 ['Transformación de datos',['Power Query y limpieza de datos','Modelo de datos','Relaciones entre tablas']],
 ['Medidas y visualizaciones',['DAX básico','Gráficos e indicadores (KPI)','Segmentadores']],
 ['Dashboard de ventas con IA',['Diseño del dashboard','Consultas con IA y Copilot','Publicar y compartir']]]},
{id:'niif',dia:'Viernes',start:13,hora:'6:00 p.m. a 9:30 p.m.',t:'NIIF para Pymes: impulsando el crecimiento y la transparencia financiera',s:'Ingresos y subvenciones',p:'Dr. Marcelo Dante Gonzales Matos',
 logro:'Al finalizar, aplicas las NIIF para Pymes en el registro de ingresos y subvenciones con criterio técnico.',
 ses:[['Marco de las NIIF para Pymes',['Importancia y alcance','Conceptos y principios','Estados financieros básicos']],
 ['Ingresos de actividades ordinarias',['Reconocimiento y medición','Venta de bienes y servicios','Casos prácticos']],
 ['Subvenciones del gobierno',['Definición y tipos','Reconocimiento y presentación','Casos prácticos']],
 ['Transparencia financiera',['Revelaciones en las notas','Impacto en la gestión de la pyme','Taller integrador']]]},
{id:'ofimatica',dia:'Sábado',start:14,hora:'9:00 a.m. a 12:30 p.m.',t:'Ofimática y las nuevas tecnologías con aplicaciones en IA',s:'Ofimática potenciada con IA,Trabajo colaborativo con Google Apps, Ofimática en la Nube',p:'Mg. Kimberly Arias Barón',
 logro:'Al finalizar el taller, dominarás la ofimática integrando herramientas de IA, desarrollando habilidades digitales para mejorar la eficiencia en el mundo académico y laboral.',
 ses:[['Documentos académicos con Word',['Configuración del documento (márgenes, orientación, tamaño)', 'Formatos (tamaño, tipografía, alineación,entre otros)','Portada','Inserción, estilos y ajustes de imágenes, formas y tablas.', 'Numeración, encabezado y pie de página','Secciones.','Nota al Pie y Nota al final.', 'Citas y Referencias bibliográficas.', 'Esquemas y Tabla de Contenido, de figuras y de tablas']],
 ['Data Aplicada a los Negocios con Excel',['Formatos y series', 'Funciones matemáticas y estadísticas', 'Funciones de texto, fecha y hora','Funciones Lógicas y de búsqueda', 'Validación de Datos y Formato condicional', 'Ordenamiento personalizado, Filtros básicos y personalizados', 'Gráficos estadísticos y Tablas Dinámicas']],
 ['Ofimática en la Nube y Trabajo colaborativo con Google Apps',['Meet, Gemini', 'Gestión de carpetas y archivos en Drive de Google (creación, compartir en línea, administración de accesos y descarga)', 'Formularios, Documentos, presentaciones y hojas de cálculo en línea']],
 ['Inteligencia Artificial en el mundo empresarial y en la educación',['Asistentes de IA y productividad', 'Redacción y revisión asistida', 'Diseño asistido']]]}
];
const app=document.getElementById('app');
const fecha=(d,k)=>new Date(2026,10,d+7*k).toLocaleDateString('es-PE',{day:'numeric',month:'long'});
const corto=(t)=>t.start;

function home(){
  app.innerHTML=`<div class="view">
  <section class="hero"><div class="container">
    <h1>Talleres extracurriculares</h1>
    <p>Inscríbete en nuestros talleres virtuales de sólo 4 sesiones, asistiendo virtualmente una vez por semana. Elige el día que te acomode y revisa el detalle de cada uno.</p>
    <ul class="facts"><li>Inicio: <b>${INFO.inicio}</b></li><li><b>${INFO.ses}</b> sesiones</li><li>Modalidad <b>${INFO.mod}</b></li><li>Inversión <b>${INFO.precio}</b></li></ul>
  </div></section>
  <section class="week"><div class="container">
    <div class="row">${T.map(x=>`<div class="col-md-6 col-lg-4"><a class="card-t" href="#${x.id}">
      <div class="day"><strong><small style="font-weight:1">Sólo </small>${x.dia}</strong><span>Inicio el ${x.start} de nov.</span></div>
      <div class="body"><h3 align="center">${x.t}</h3><p>${x.s}</p><span class="who">${x.p}</span><span class="who" style="font-weight:500;color:var(--muted)">${x.hora}</span><span class="more">Ver más</span></div>
    </a></div>`).join('')}</div>
    <div class="info"><img class="fly" style="max-width:340px" src="${FLY.general}" alt="Flyer general de los talleres extracurriculares UMA, inicio 9 de noviembre" loading="lazy"><div><h1>Talleres del mes de Noviembre</h1><h2>Un taller suma a tu formación</h2><p>Cada taller otorga ${INFO.cred}.<br>Todos se dictan en vivo, por videoconferencia.<br>Las sesiones se apoyan utilizando recursos audiovisuales alojados en el aula virtual y de acceso 24/7</p><p style="margin-top:1rem"><a class="btn" href="${FORM}" target="_blank" rel="noopener">Inscríbete</a></p></div></div>
  </div></section></div>`;
  document.title='Talleres Extracurriculares UMA';
}

function detail(i){
  const x=T[i],prev=T[i-1],next=T[i+1];
  app.innerHTML=`<div class="view">
  <section class="d-head"><div class="container">
    <button class="back" id="back">← Regresar a todos los talleres</button>
    <h1>${x.t}</h1><p>${x.s}</p>
  </div></section>
  <section class="stats"><div class="container"><div class="row">
    <div class="col-md-6 col-lg-3"><div class="box"><small>Ponente</small><b>${x.p}</b></div></div>
    <div class="col-md-6 col-lg-3"><div class="box"><small>Horario</small><b>${x.hora}</b></div></div>
    <div class="col-md-6 col-lg-3"><div class="box"><small>Frecuencia</small><b>Todos los ${x.dia.toLowerCase()} | ${INFO.ses} sesiones</b></div></div>
    <div class="col-md-6 col-lg-3"><div class="box"><small>Modalidad e inversión</small><b>${INFO.mod} | ${INFO.precio}</b></div></div>
  </div>
  <h2 class="sec-title">Fechas de las sesiones</h2>
  <ul class="chips">${[0,1,2,3].map(k=>`<li>Sesión ${k+1}: ${x.dia} ${fecha(x.start,k)}</li>`).join('')}</ul>
  <h2 class="sec-title">Logro de aprendizaje</h2>
  <div class="goal">${x.logro}</div>
  <h2 class="sec-title">Temas y contenidos por sesión</h2>
  <p class="lead">Abre cada sesión para ver lo que se trabajará.</p>
  <section class="row">
  <article class="col-lg-8">
      <div class="acc">${x.ses.map((s,k)=>`<div class="acc-item">
        <button class="acc-btn" aria-expanded="${k==0}" aria-controls="p${k}"><span class="n">${k+1}</span><span>${s[0]}<span class="d">${x.dia} ${fecha(x.start,k)}</span></span><span class="ch" aria-hidden="true">⌄</span></button>
        <div class="acc-panel ${k==0?'show':''}" id="p${k}"><h4>Contenidos</h4><ul>${s[1].map(c=>`<li>${c}</li>`).join('')}</ul></div></div>`).join('')}</div>
  </article>
  <article class="col-lg-4">
      <!--<h2 class="sec-title">Cónoce más del Taller</h2>-->
      <div class="fly-wrap"><a class="btn" href="${FORM}" target="_blank" rel="noopener">Inscríbete a este taller</a><img class="fly" src="${FLY[x.id]}" alt="Flyer del taller ${x.t}" loading="lazy"></div>
  </article>
  </section>
  <div class="nav2">${prev?`<a class="btn" href="#${prev.id}">← ${prev.dia}: ${prev.t.split(':')[0]}</a>`:'<span></span>'}${next?`<a class="btn" href="#${next.id}">${next.dia}: ${next.t.split(':')[0]} →</a>`:'<span></span>'}</div>
  <div class="cta"><h2>¿Listo para empezar el ${x.start} de noviembre?</h2><a class="btn" href="${FORM}" target="_blank" rel="noopener">Inscríbete ahora</a></div>
  </div></section></div>`;
  document.title=x.t+' | Talleres UMA';
  document.getElementById('back').onclick=()=>{location.hash=''};
  app.querySelectorAll('.acc-btn').forEach(b=>b.onclick=()=>{
    const open=b.getAttribute('aria-expanded')==='true';
    b.setAttribute('aria-expanded',!open);
    document.getElementById(b.getAttribute('aria-controls')).classList.toggle('show',!open);
  });
}

function route(){
  const id=location.hash.slice(1),i=T.findIndex(x=>x.id===id);
  i<0?home():detail(i);
  window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);
document.getElementById('logo').addEventListener('click',e=>{e.preventDefault();location.hash=''; if(!location.hash)route();});
route();
</script>
</body>
</html>
